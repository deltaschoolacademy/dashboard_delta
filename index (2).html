<style>
:root{
  --preto:#0B0B09;--preto-2:#15150F;--preto-3:#1F1F18;
  --ivory:#F2F1EC;--ivory-2:#EAE9E2;--white:#FFFFFF;
  --oliva:#5B6543;--oliva-claro:#8A9464;--oliva-hover:#6E7A50;
  --linha:#DCDBD2;--linha-dark:#2C2C24;
  --txt:#1A1A15;--txt-suave:#6B6B60;--txt-inv:#F2F1EC;--txt-inv-suave:#9A9A8C;
  --ok:#5B6543;--ok-bg:#EAEDE2;--pend:#9C7A2E;--pend-bg:#F4EDD9;
  --atraso:#9E5138;--atraso-bg:#F3E2DA;--info:#4A5A66;--info-bg:#E2E9ED;
  --receita:#5B6543;--despesa:#B08843;
  --shadow:0 1px 2px rgba(11,11,9,.04),0 8px 24px rgba(11,11,9,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Montserrat',sans-serif;background:var(--ivory);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
.tec{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--txt-suave)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
a{color:inherit}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--preto);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{width:360px;max-width:92vw;background:var(--preto-2);border:1px solid var(--linha-dark);border-radius:16px;padding:34px 30px;color:var(--txt-inv)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dmark{width:30px;height:30px;flex:none}
.login-card h1{font-size:17px;font-weight:700;letter-spacing:.02em}
.login-card .sub{color:var(--txt-inv-suave);font-size:12px;margin-bottom:22px}
.login-brand{background:var(--ivory);border-radius:12px;padding:20px 22px;margin-bottom:18px;display:flex;justify-content:center}
.login-brand img{width:100%;max-width:250px;height:auto;display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-inv-suave);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:11px 12px;background:var(--preto-3);border:1px solid var(--linha-dark);border-radius:9px;color:var(--txt-inv)}
.field input:focus{outline:none;border-color:var(--oliva-claro)}
.btn{background:var(--oliva);color:#fff;border:none;padding:11px 16px;border-radius:9px;font-weight:600;letter-spacing:.02em}
.btn:hover{background:var(--oliva-hover)}
.btn-block{width:100%;margin-top:6px}
.btn-ghost{background:transparent;border:1px solid var(--linha);color:var(--txt)}
.btn-ghost:hover{background:var(--ivory-2)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.msg{font-size:12.5px;margin-top:12px;min-height:16px}
.msg.err{color:#E39C86}.msg.ok{color:var(--oliva-claro)}

/* APP SHELL */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--preto);color:var(--txt-inv);flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-top{padding:22px 20px 16px;border-bottom:1px solid var(--linha-dark)}
.sb-logo{display:flex;align-items:center;gap:9px}
.sb-logo b{font-size:14px;font-weight:700;letter-spacing:.04em}
.sb-logo .sub{font-size:9.5px;letter-spacing:.16em;color:var(--txt-inv-suave);text-transform:uppercase}
.nav{padding:12px 12px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;color:var(--txt-inv-suave);font-weight:500;cursor:pointer;margin-bottom:2px;font-size:13.5px}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav-item:hover{background:var(--preto-2);color:var(--ivory)}
.nav-item.on{background:var(--oliva);color:#fff}
.sb-bot{padding:14px;border-top:1px solid var(--linha-dark);font-size:11.5px;color:var(--txt-inv-suave)}
.sb-bot .who{color:var(--ivory);font-weight:600;margin-bottom:8px;font-size:12px;word-break:break-all}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:16px;font-weight:700}
.topbar .search{margin-left:auto;position:relative}
.topbar .search input{width:260px;padding:9px 12px 9px 34px;border:1px solid var(--linha);border-radius:9px;background:var(--ivory)}
.topbar .search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;stroke:var(--txt-suave);fill:none;stroke-width:1.8}
.content{padding:24px 26px;max-width:1180px;width:100%}

.card{background:var(--white);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--shadow)}
.card-h{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:14px;font-weight:700}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1.4fr 1fr}
@media(max-width:900px){.g-kpi{grid-template-columns:repeat(2,1fr)}.g-2{grid-template-columns:1fr}}
.kpi{background:var(--white);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-suave);font-weight:600}
.kpi .v{font-size:23px;font-weight:700;margin-top:8px}
.kpi .v.in{color:var(--receita)}.kpi .v.out{color:var(--despesa)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-suave);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--linha)}
td{padding:11px 12px;border-bottom:1px solid var(--ivory-2);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.cell-name{font-weight:600}.cell-sub{font-size:11.5px;color:var(--txt-suave);font-weight:400;margin-top:2px}
.v-in{color:var(--receita);font-weight:600}.v-out{color:var(--despesa);font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-pend{background:var(--pend-bg);color:var(--pend)}
.p-atraso{background:var(--atraso-bg);color:var(--atraso)}.p-info{background:var(--info-bg);color:var(--info)}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--ivory-2);color:var(--txt-suave)}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--txt-suave)}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--oliva);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
.inp{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:9px;background:var(--white)}
.inp:focus{outline:none;border-color:var(--oliva)}
.lbl{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-suave);font-weight:600;margin-bottom:5px}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(11,11,9,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.overlay.on{display:flex}
.modal{background:var(--white);border-radius:16px;width:560px;max-width:96vw;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center}
.modal-h h3{font-size:15px;font-weight:700}
.modal-b{padding:20px}
.modal-f{padding:16px 20px;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end}
.x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--txt-suave);cursor:pointer;line-height:1}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ivory-2)}
.doc-row:last-child{border:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--atraso)}
.resp{font-size:10.5px;color:var(--txt-suave);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.empty{padding:40px;text-align:center;color:var(--txt-suave)}
.loading{padding:30px;text-align:center;color:var(--txt-suave)}
</style>
</head>
<body>

<!-- LOGIN -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIG (chaves reais embutidas) ============ */
const SUPABASE_URL='https://fdjriojmowlpvophnrso.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkanJpb2ptb3dscHZvcGhucnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzE3NDAsImV4cCI6MjEwMzQwNzc0MH0.IfGDkV1_hDyDNHWhSdinqv1cIuxglGmpoCFav5Jn8zY';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

/* ============ HELPERS ============ */
const BRL=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ini=n=>(n||'?').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const el=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>new Date().toISOString().slice(0,10);
const dBR=d=>{if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d};
const onlyNum=s=>(s||'').replace(/\D/g,'');
function toast(m,ok=true){const b=el('li-msg');/*reuse*/ console.log(m);}   // simple

async function q(promise){const {data,error}=await promise; if(error){console.error(error); throw error;} return data;}

/* modal */
function openOv(title,body,foot){el('ov-title').innerHTML=title;el('ov-body').innerHTML=body;el('ov-foot').innerHTML=foot||'';el('ov').classList.add('on');}
function closeOv(){el('ov').classList.remove('on');}
el('ov').addEventListener('click',e=>{if(e.target===el('ov'))closeOv();});

/* ============ AUTH ============ */
async function doLogin(){
  const email=el('li-email').value.trim(), pass=el('li-pass').value;
  const m=el('li-msg'); m.className='msg'; m.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){m.className='msg err';m.textContent='Não foi possível entrar: '+error.message;return;}
  m.textContent='';
}
el('li-btn').addEventListener('click',doLogin);
el('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
el('logout').addEventListener('click',async()=>{await sb.auth.signOut();});

sb.auth.onAuthStateChange((_e,session)=>{
  if(session&&session.user){
    el('login').style.display='none'; el('app').style.display='block';
    el('who').textContent=session.user.email;
    go(currentView);
  }else{
    el('app').style.display='none'; el('login').style.display='flex';
  }
});

/* ============ NAV ============ */
let currentView='inicio';
const titles={inicio:'Início',clientes:'Clientes',despachante:'Serviços de Despachante',academy:'Delta School Academy'};
function go(v){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.view===v));
  el('pageTitle').textContent=titles[v]||'—';
  el('view').innerHTML='<div class="loading">Carregando…</div>';
  ({inicio:vInicio,clientes:vClientes,despachante:vDespachante,academy:vAcademy}[v]||vInicio)();
}
el('nav').addEventListener('click',e=>{const it=e.target.closest('.nav-item'); if(it)go(it.dataset.view);});

/* ============ INÍCIO (financeiro) ============ */
async function vInicio(){
  try{
    const lanc=await q(sb.from('lancamentos').select('*').order('data',{ascending:false}));
    const rec=lanc.filter(l=>l.tipo==='receita').reduce((a,l)=>a+Number(l.valor),0);
    const des=lanc.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+Number(l.valor),0);
    const saldo=rec-des;
    const rows=lanc.map(l=>{
      const ft=l.fonte==='cupom'?'<span class="tag" style="background:#E2E9ED;color:#4A5A66">cupom fiscal</span>'
        :l.fonte==='auto'?'<span class="tag" style="background:#EAEDE2;color:#5B6543">automático</span>'
        :'<span class="tag">manual</span>';
      return `<tr>
        <td>${l.tipo==='receita'?'<span class="pill p-ok">entrada</span>':'<span class="pill p-atraso">saída</span>'}</td>
        <td class="cell-name">${esc(l.descricao)}<div class="cell-sub">${esc(l.fornecedor||l.categoria||'')}</div></td>
        <td><span class="tag">${esc(l.categoria||'—')}</span></td>
        <td>${ft}</td>
        <td class="mono">${dBR(l.data)}</td>
        <td class="mono ${l.tipo==='receita'?'v-in':'v-out'}" style="text-align:right">${l.tipo==='receita'?'+':'−'} ${BRL(l.valor)}</td>
      </tr>`;}).join('');
    el('view').innerHTML=`
      <div class="grid g-kpi" style="margin-bottom:16px">
        <div class="kpi"><div class="l">Receitas</div><div class="v in">${BRL(rec)}</div></div>
        <div class="kpi"><div class="l">Despesas</div><div class="v out">${BRL(des)}</div></div>
        <div class="kpi"><div class="l">Saldo</div><div class="v">${BRL(saldo)}</div></div>
        <div class="kpi"><div class="l">Lançamentos</div><div class="v">${lanc.length}</div></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Fluxo de caixa</h3><div class="spacer"></div>
          <button class="btn btn-sm" onclick="modalDespesa()">+ Lançar despesa</button></div>
        <div class="card-b" style="padding:0">
          ${lanc.length?`<table><thead><tr><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Fonte</th><th>Data</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows}</tbody></table>`
            :'<div class="empty">Nenhum lançamento ainda. As receitas aparecem sozinhas quando você registra um pagamento.</div>'}
        </div>
      </div>`;
  }catch(e){el('view').innerHTML=erro(e);}
}
function modalDespesa(){
  openOv('Lançar despesa',`
    <div class="form-grid">
      <div class="full"><label class="lbl">Descrição</label><input class="inp" id="d-desc" placeholder="Ex.: Aluguel do estande"></div>
      <div><label class="lbl">Categoria</label><input class="inp" id="d-cat" placeholder="Operacional"></div>
      <div><label class="lbl">Fornecedor</label><input class="inp" id="d-forn" placeholder="Opcional"></div>
      <div><label class="lbl">Valor (R$)</label><input class="inp mono" id="d-val" type="number" step="0.01" placeholder="0,00"></div>
      <div><label class="lbl">Data</label><input class="inp" id="d-data" type="date" value="${hoje()}"></div>
    </div>
    <div class="msg" id="d-msg" style="color:var(--atraso)"></div>`,
    `<button class="btn btn-ghost" onclick="closeOv()">Cancelar</button><button class="btn" onclick="salvarDespesa()">Salvar despesa</button>`);
}
async function salvarDespesa(){
  const desc=el('d-desc').value.trim(), val=parseFloat(el('d-val').value);
  if(!desc||!(val>0)){el('d-msg').textContent='Preencha descrição e valor.';return;}
  try{
    await q(sb.from('lancamentos').insert({tipo:'despesa',descricao:desc,categoria:el('d-cat').value.trim()||'Geral',
      fornecedor:el('d-forn').value.trim()||null,valor:val,data:el('d-data').value||hoje(),fonte:'manual'}));
    closeOv(); vInicio();
  }catch(e){el('d-msg').textContent='Erro ao salvar: '+e.message;}
}

/* ============ CLIENTES ============ */
let _clientes=[];
async function vClientes(filter=''){
  try{
    _clientes=await q(sb.from('clientes').select('*').order('nome'));
    renderClientes(filter);
  }catch(e){el('view').innerHTML=erro(e);}
}
function renderClientes(filter=''){
  const f=filter.toLowerCase();
  const list=_clientes.filter(c=>!f||[c.nome,c.cpf,c.telefone].some(x=>(x||'').toLowerCase().includes(f)||onlyNum(x).includes(onlyNum(f))));
  const rows=list.map(c=>`<tr style="cursor:pointer" onclick="verCliente('${c.id}')">
      <td><div class="rowflex"><div class="avatar">${ini(c.nome)}</div><div class="cell-name">${esc(c.nome)}<div class="cell-sub">${esc(c.cidade||'')}${c.uf?'/'+esc(c.uf):''}</div></div></div></td>
      <td class="mono">${esc(c.cpf||'—')}</td><td class="mono">${esc(c.telefone||'—')}</td>
      <td>${esc(c.cr_caf||'—')}</td></tr>`).join('');
  el('view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>Clientes <span class="muted" style="font-weight:500">(${list.length})</span></h3><div class="spacer"></div>
        <button class="btn btn-sm" onclick="modalCliente()">+ Novo cliente</button></div>
      <div class="card-b" style="padding:0">
        ${list.length?`<table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>CR/CAF</th></tr></thead><tbody>${rows}</tbody></table>`
          :'<div class="empty">Nenhum cliente. Cadastre o primeiro no botão acima.</div>'}
      </div>
    </div>`;
}

async function salvarCliente(){
  const nome=el('c-nome').value.trim();
  if(!nome){el('c-msg').textContent='Informe o nome.';return;}
  const rec={nome,cpf:el('c-cpf').value.trim()||null,rg:el('c-rg').value.trim()||null,
    telefone:el('c-tel').value.trim()||null,nascimento:el('c-nasc').value||null,
    email:el('c-email').value.trim()||null,email_govbr:el('c-govbr').value.trim()||null,
    cidade:el('c-cidade').value.trim()||null,uf:el('c-uf').value.trim().toUpperCase()||null,
    nacionalidade:el('c-nac').value.trim()||null,naturalidade:el('c-natu').value.trim()||null,
    profissao:el('c-prof').value.trim()||null,cr_caf:el('c-cr').value.trim()||null,clube:el('c-clube').value.trim()||null};
  try{await q(sb.from('clientes').insert(rec));closeOv();vClientes();}
  catch(e){el('c-msg').textContent=(e.message.includes('duplicate')?'CPF já cadastrado.':'Erro: '+e.message);}
}
async function verCliente(id){
  try{
    const c=(await q(sb.from('clientes').select('*').eq('id',id)))[0];
    const docs=await q(sb.from('documentos').select('*, documentos_catalogo(nome_comercial,nome_sistema)').eq('cliente_id',id));
    const procs=await q(sb.from('processos').select('*, tipos_processo(nome)').eq('cliente_id',id));
    const docRows=docs.length?docs.map(d=>{
      const nome=d.documentos_catalogo?.nome_comercial||d.tipo_doc||'Documento';
      const venc=d.data_validade?` · vence ${dBR(d.data_validade)}`:'';
      return `<div class="doc-row"><span class="dot ${d.status==='recebido'?'on':'off'}"></span><div style="flex:1">${esc(nome)}<div class="cell-sub">${esc(d.nome_padrao||'')}${venc}</div></div></div>`;
    }).join(''):'<div class="muted" style="padding:8px 0">Nenhum documento no cadastro ainda.</div>';
    const procRows=procs.length?procs.map(p=>`<div class="doc-row"><div style="flex:1">${esc(p.tipos_processo?.nome||'Processo')}<div class="cell-sub">${esc(p.status)}${p.atividade?' · '+esc(p.atividade):''}</div></div><span class="pill p-info">${esc(p.status)}</span></div>`).join(''):'<div class="muted" style="padding:8px 0">Nenhum processo.</div>';
    openOv(esc(c.nome),`
      <div class="rowflex" style="margin-bottom:14px">
        <div class="avatar" style="width:44px;height:44px;font-size:15px">${ini(c.nome)}</div>
        <div><div style="font-weight:700">${esc(c.nome)}</div><div class="cell-sub">${esc(c.cpf||'—')} · ${esc(c.telefone||'—')}</div></div>
      </div>
      <div class="form-grid" style="margin-bottom:16px">
        <div><span class="lbl">Cidade</span>${esc(c.cidade||'—')}${c.uf?'/'+esc(c.uf):''}</div>
        <div><span class="lbl">Nascimento</span>${dBR(c.nascimento)}</div>
        <div><span class="lbl">E-mail</span>${esc(c.email||'—')}</div>
        <div><span class="lbl">CR/CAF</span>${esc(c.cr_caf||'—')}</div>
        <div><span class="lbl">Profissão</span>${esc(c.profissao||'—')}</div>
        <div><span class="lbl">Clube</span>${esc(c.clube||'—')}</div>
      </div>
      <div class="lbl">Documentos</div>${docRows}
      <div class="lbl" style="margin-top:14px">Processos</div>${procRows}`,
      `<button class="btn btn-ghost" onclick="closeOv()">Fechar</button><button class="btn" onclick="closeOv();go('despachante')">Abrir despachante</button>`);
  }catch(e){openOv('Erro',erro(e));}
}

/* ============ DESPACHANTE ============ */
let _tipos=[];
async function vDespachante(){
  try{
    _tipos=await q(sb.from('tipos_processo').select('*').order('nome'));
    _clientes=await q(sb.from('clientes').select('id,nome,cpf,telefone').order('nome'));
    const optC=_clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
    const optT=_tipos.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('');
    el('view').innerHTML=`
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Montar processo</h3></div>
        <div class="card-b">
          <div class="form-grid">
            <div><label class="lbl">Cliente</label><select class="inp" id="dp-cli">${optC||'<option>—</option>'}</select></div>
            <div><label class="lbl">Operação</label><select class="inp" id="dp-tipo">${optT}</select></div>
            <div><label class="lbl">Atividade</label><select class="inp" id="dp-ativ">
              <option value="atirador">Atirador desportivo</option>
              <option value="colecionador">Colecionador</option>
              <option value="cacador">Caçador</option></select></div>
            <div style="display:flex;align-items:flex-end"><button class="btn" style="width:100%" onclick="montarChecklist()">Ver documentos exigidos</button></div>
          </div>
        </div>
      </div>
      <div id="dp-out"></div>`;
  }catch(e){el('view').innerHTML=erro(e);}
}
function condOK(cond,ativ){
  if(cond==='sempre'||cond==='se_2o_endereco')return true;
  if(cond==='so_atirador')return ativ==='atirador';
  if(cond==='dispensado_colecionador')return ativ!=='colecionador';
  if(cond==='condicional_cacador')return ativ==='cacador';
  if(cond==='condicional_colecionador')return ativ==='colecionador';
  return true;
}
async function montarChecklist(){
  const cid=el('dp-cli').value, tid=el('dp-tipo').value, ativ=el('dp-ativ').value;
  if(!cid){el('dp-out').innerHTML='<div class="empty">Cadastre/selecione um cliente primeiro.</div>';return;}
  el('dp-out').innerHTML='<div class="loading">Cruzando documentos…</div>';
  try{
    const req=await q(sb.from('tipos_processo_docs').select('condicional,ordem, documentos_catalogo(id,codigo,nome_comercial,nome_sistema,responsavel,validade_tipo,validade_dias)').eq('tipo_processo_id',tid).order('ordem'));
    const cli=(await q(sb.from('clientes').select('*').eq('id',cid)))[0];
    const docs=await q(sb.from('documentos').select('catalogo_id,status,data_validade').eq('cliente_id',cid));
    const temValido=catId=>docs.some(d=>d.catalogo_id===catId&&d.status==='recebido'&&(!d.data_validade||d.data_validade>=hoje()));
    const aplic=req.filter(r=>condOK(r.condicional,ativ));
    const respLabel={cliente:'Cliente',delta:'Delta',agente_credenciado:'Agente credenciado',clube:'Clube',sistema:'Taxa/Sistema'};
    let faltando=[];
    const rows=aplic.map(r=>{
      const d=r.documentos_catalogo; const has=temValido(d.id);
      if(!has)faltando.push(d);
      const cond = r.condicional==='se_2o_endereco'?' <span class="tag">se 2º endereço</span>':'';
      return `<div class="doc-row">
        <span class="dot ${has?'on':'off'}"></span>
        <div style="flex:1">${esc(d.nome_comercial||d.nome_sistema)}${cond}<div class="cell-sub">${esc(d.nome_sistema)}</div></div>
        <span class="resp">${respLabel[d.responsavel]||d.responsavel}</span>
        ${has?'<span class="pill p-ok">ok</span>':`<button class="btn btn-sm" onclick="marcarDoc('${cid}','${d.id}','${tid}','${esc(d.nome_comercial||d.nome_sistema)}',${d.validade_dias||'null'})">Enviar</button>`}
      </div>`;}).join('');
    const tel=onlyNum(cli.telefone);
    el('dp-out').innerHTML=`
      <div class="card"><div class="card-h"><h3>Checklist — ${esc(_tipos.find(t=>t.id===tid)?.nome||'')}</h3>
        <div class="spacer"></div><span class="muted">${aplic.length-faltando.length}/${aplic.length} ok</span></div>
        <div class="card-b">${rows}
          <div class="rowflex" style="margin-top:16px">
            <button class="btn btn-ghost btn-sm" onclick="copiarMsg('${cid}','${tid}','${ativ}')">Copiar mensagem de pendências</button>
            ${tel?`<button class="btn btn-sm" onclick="abrirWa('${cid}','${tid}','${ativ}','${tel}')">Abrir no WhatsApp</button>`:'<span class="muted">Sem telefone p/ WhatsApp</span>'}
            <div class="spacer"></div>
            <button class="btn btn-sm" onclick="criarProcesso('${cid}','${tid}','${ativ}')">Iniciar processo</button>
          </div>
        </div></div>`;
  }catch(e){el('dp-out').innerHTML=erro(e);}
}
async function marcarDoc(cid,catId,tid,nome,validadeDias){
  // Phase 1: registra recebimento + validade calculada (sem Drive)
  const emiss=hoje();
  let validade=null;
  if(validadeDias&&validadeDias!=='null'){const dt=new Date();dt.setDate(dt.getDate()+Number(validadeDias));validade=dt.toISOString().slice(0,10);}
  const cli=(await q(sb.from('clientes').select('cpf,nome').eq('id',cid)))[0];
  const nomePadrao=`${onlyNum(cli.cpf)||'SEMCPF'}_${(cli.nome||'').toUpperCase().replace(/\s+/g,'-')}_${nome.toUpperCase().replace(/\s+/g,'-')}_${emiss}.pdf`;
  try{
    await q(sb.from('documentos').insert({cliente_id:cid,catalogo_id:catId,tipo_doc:nome,nome_padrao:nomePadrao,
      data_emissao:emiss,data_validade:validade,status:'recebido'}));
    montarChecklist();
  }catch(e){alert('Erro ao registrar documento: '+e.message);}
}
async function faltantes(cid,tid,ativ){
  const req=await q(sb.from('tipos_processo_docs').select('condicional, documentos_catalogo(id,nome_comercial,nome_sistema,responsavel)').eq('tipo_processo_id',tid));
  const docs=await q(sb.from('documentos').select('catalogo_id,status,data_validade').eq('cliente_id',cid));
  const temValido=catId=>docs.some(d=>d.catalogo_id===catId&&d.status==='recebido'&&(!d.data_validade||d.data_validade>=hoje()));
  return req.filter(r=>condOK(r.condicional,ativ)&&!temValido(r.documentos_catalogo.id)).map(r=>r.documentos_catalogo);
}
function msgPendencias(nomeOp,cliNome,lista){
  const linhas=lista.map(d=>{
    const quem=d.responsavel==='cliente'?'':' (providenciamos)';
    return `• ${d.nome_comercial||d.nome_sistema}${quem}`;}).join('\n');
  return `Olá, ${cliNome}! Aqui é da Delta School Academy.\n\nPara darmos andamento ao seu processo de *${nomeOp}*, ainda faltam os seguintes documentos:\n\n${linhas}\n\nAssim que puder, nos envie por aqui. Qualquer dúvida, estamos à disposição.`;
}
async function copiarMsg(cid,tid,ativ){
  try{
    const cli=(await q(sb.from('clientes').select('nome').eq('id',cid)))[0];
    const lista=await faltantes(cid,tid,ativ);
    const nomeOp=_tipos.find(t=>t.id===tid)?.nome||'processo';
    if(!lista.length){await navigator.clipboard.writeText(`Olá, ${cli.nome}! Sua documentação para ${nomeOp} está completa. 👍`);alert('Documentação completa — mensagem copiada.');return;}
    await navigator.clipboard.writeText(msgPendencias(nomeOp,cli.nome,lista));
    alert('Mensagem de pendências copiada para a área de transferência.');
  }catch(e){alert('Erro: '+e.message);}
}
async function abrirWa(cid,tid,ativ,tel){
  const cli=(await q(sb.from('clientes').select('nome').eq('id',cid)))[0];
  const lista=await faltantes(cid,tid,ativ);
  const nomeOp=_tipos.find(t=>t.id===tid)?.nome||'processo';
  const txt=lista.length?msgPendencias(nomeOp,cli.nome,lista):`Olá, ${cli.nome}! Sua documentação para ${nomeOp} está completa. 👍`;
  const num=tel.length<=11?'55'+tel:tel;
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`,'_blank');
  return false;
}
async function criarProcesso(cid,tid,ativ){
  try{
    await q(sb.from('processos').insert({cliente_id:cid,tipo_processo_id:tid,atividade:ativ,status:'coleta_documentos'}));
    alert('Processo iniciado e vinculado ao cliente.');
  }catch(e){alert('Erro ao iniciar processo: '+e.message);}
}

/* ============ ACADEMIA ============ */
async function vAcademy(){
  try{
    const cursos=await q(sb.from('cursos').select('*').order('nome'));
    const turmas=await q(sb.from('turmas').select('*, cursos(nome,carga_horaria,valor_padrao)').order('data'));
    const cards=turmas.map(t=>`
      <div class="card" style="margin-bottom:12px"><div class="card-h">
        <h3>${esc(t.cursos?.nome||'Curso')}</h3>
        <span class="pill p-info" style="margin-left:8px">${esc(t.status)}</span>
        <div class="spacer"></div><span class="muted mono">${dBR(t.data)} ${t.hora?('· '+t.hora.slice(0,5)):''}</span></div>
        <div class="card-b">
          <div class="rowflex"><span class="tag">${esc(t.cursos?.carga_horaria||'')}</span><span class="tag">${esc(t.local||'')}</span>
          <div class="spacer"></div><button class="btn btn-sm" onclick="verTurma('${t.id}')">Gerenciar turma</button></div>
        </div></div>`).join('');
    el('view').innerHTML=`
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Catálogo de cursos</h3></div>
        <div class="card-b"><div class="rowflex">${cursos.map(c=>`<span class="tag" style="padding:8px 12px">${esc(c.nome)} · ${esc(c.carga_horaria||'')}${c.valor_padrao?' · '+BRL(c.valor_padrao):''}</span>`).join('')||'<span class="muted">Sem cursos</span>'}</div></div>
      </div>
      <div class="lbl" style="margin-bottom:8px">Turmas</div>
      ${turmas.length?cards:'<div class="empty">Nenhuma turma.</div>'}`;
  }catch(e){el('view').innerHTML=erro(e);}
}
async function verTurma(tid){
  try{
    const t=(await q(sb.from('turmas').select('*, cursos(nome,valor_padrao)').eq('id',tid)))[0];
    const mats=await q(sb.from('matriculas').select('*, clientes(nome), pagamentos(valor)').eq('turma_id',tid));
    const linhas=mats.map(m=>{
      const pago=(m.pagamentos||[]).reduce((a,p)=>a+Number(p.valor),0);
      const saldo=Number(m.valor_total)-pago;
      return `<div class="doc-row"><div style="flex:1">${esc(m.clientes?.nome||'—')}
        <div class="cell-sub">Total ${BRL(m.valor_total)} · Pago ${BRL(pago)} · Saldo ${BRL(saldo)}</div></div>
        ${saldo>0?`<button class="btn btn-sm" onclick="modalPagamento('${m.id}',${saldo})">Registrar entrada</button>`:'<span class="pill p-ok">quitado</span>'}
      </div>`;}).join('');
    const optC=_clientes.length?_clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join(''):(await q(sb.from('clientes').select('id,nome').order('nome'))).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
    openOv(esc(t.cursos?.nome||'Turma'),`
      <div class="muted" style="margin-bottom:12px">${dBR(t.data)} ${t.hora?('· '+t.hora.slice(0,5)):''} · ${esc(t.local||'')}</div>
      <div class="lbl">Alunos matriculados</div>
      ${mats.length?linhas:'<div class="muted" style="padding:8px 0">Nenhum aluno ainda.</div>'}
      <div class="lbl" style="margin-top:16px">Inscrever aluno</div>
      <div class="form-grid">
        <div><label class="lbl">Cliente</label><select class="inp" id="mt-cli">${optC}</select></div>
        <div><label class="lbl">Valor do curso (R$)</label><input class="inp mono" id="mt-val" type="number" step="0.01" value="${t.cursos?.valor_padrao||''}"></div>
      </div>
      <div class="msg" id="mt-msg" style="color:var(--atraso)"></div>`,
      `<button class="btn btn-ghost" onclick="closeOv()">Fechar</button><button class="btn" onclick="inscrever('${tid}')">Inscrever</button>`);
  }catch(e){openOv('Erro',erro(e));}
}
async function inscrever(tid){
  const cid=el('mt-cli').value, val=parseFloat(el('mt-val').value);
  if(!cid||!(val>0)){el('mt-msg').textContent='Selecione o aluno e informe o valor.';return;}
  try{
    await q(sb.from('matriculas').insert({turma_id:tid,cliente_id:cid,valor_total:val}));
    verTurma(tid);
  }catch(e){el('mt-msg').textContent=(e.message.includes('duplicate')?'Aluno já matriculado nesta turma.':'Erro: '+e.message);}
}
function modalPagamento(matId,saldo){
  openOv('Registrar entrada',`
    <div class="form-grid">
      <div><label class="lbl">Valor (R$)</label><input class="inp mono" id="pg-val" type="number" step="0.01" value="${saldo}"></div>
      <div><label class="lbl">Data</label><input class="inp" id="pg-data" type="date" value="${hoje()}"></div>
      <div class="full"><label class="lbl">Método</label><input class="inp" id="pg-met" placeholder="Pix / dinheiro / cartão"></div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">Ao salvar, a receita entra sozinha no fluxo de caixa (Início).</div>
    <div class="msg" id="pg-msg" style="color:var(--atraso)"></div>`,
    `<button class="btn btn-ghost" onclick="closeOv()">Cancelar</button><button class="btn" onclick="salvarPagamento('${matId}')">Salvar entrada</button>`);
}
async function salvarPagamento(matId){
  const val=parseFloat(el('pg-val').value);
  if(!(val>0)){el('pg-msg').textContent='Informe o valor.';return;}
  try{
    const m=(await q(sb.from('matriculas').select('turma_id').eq('id',matId)))[0];
    await q(sb.from('pagamentos').insert({matricula_id:matId,tipo:'entrada',valor:val,data:el('pg-data').value||hoje(),metodo:el('pg-met').value.trim()||null}));
    closeOv(); verTurma(m.turma_id);
  }catch(e){el('pg-msg').textContent='Erro: '+e.message;}
}

/* ============ SEARCH ============ */
el('globalSearch').addEventListener('input',e=>{
  if(currentView!=='clientes')go('clientes');
  setTimeout(()=>renderClientes(e.target.value),50);
});

function erro(e){return `<div class="empty">Erro ao carregar: ${esc(e.message||e)}.<br><span class="muted">Verifique conexão e permissões (RLS) e recarregue.</span></div>`;}

/* boot */
(async()=>{const {data}=await sb.auth.getSession(); if(!data.session){el('login').style.display='flex';}})();
