<style>
:root{
  --preto:#0B0B09;--preto-2:#15150F;--preto-3:#1F1F18;
  --ivory:#F2F1EC;--ivory-2:#EAE9E2;--white:#FFFFFF;
  --oliva:#5B6543;--oliva-claro:#8A9464;--oliva-hover:#6E7A50;
  --linha:#DCDBD2;--linha-dark:#2C2C24;
  --txt:#1A1A15;--txt-suave:#6B6B60;--txt-inv:#F2F1EC;--txt-inv-suave:#9A9A8C;
  --ok:#5B6543;--ok-bg:#EAEDE2;--pend:#9C7A2E;--pend-bg:#F4EDD9;
  --atraso:#9E5138;--atraso-bg:#F3E2DA;--info:#4A5A66;--info-bg:#E2E9ED;
  --receita:#5B6543;--despesa:#B08843;
  --shadow:0 1px 2px rgba(11,11,9,.04),0 8px 24px rgba(11,11,9,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Montserrat',sans-serif;background:var(--ivory);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
.muted{color:var(--txt-suave)}
.spacer{flex:1}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--preto);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.login-card{width:380px;max-width:100%;background:var(--preto-2);border:1px solid var(--linha-dark);border-radius:16px;padding:30px 26px;color:var(--txt-inv)}
.login-brand{background:var(--ivory);border-radius:12px;padding:20px 22px;margin-bottom:18px;display:flex;justify-content:center}
.login-brand img{width:100%;max-width:240px;height:auto;display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-inv-suave);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:12px;background:var(--preto-3);border:1px solid var(--linha-dark);border-radius:9px;color:var(--txt-inv)}
.field input:focus{outline:none;border-color:var(--oliva-claro)}
.sub{color:var(--txt-inv-suave);font-size:12px;text-align:center;margin-bottom:18px}
.btn{background:var(--oliva);color:#fff;border:none;padding:11px 16px;border-radius:9px;font-weight:600;letter-spacing:.02em}
.btn:hover{background:var(--oliva-hover)}
.btn:disabled{opacity:.6;cursor:default}
.btn-block{width:100%}
.btn-ghost{background:transparent;border:1px solid var(--linha);color:var(--txt)}
.btn-ghost:hover{background:var(--ivory-2)}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn-danger{background:var(--atraso)}
.msg{font-size:12.5px;margin-top:12px;min-height:16px}
.msg.err{color:#E39C86}

/* SHELL */
#app{display:none}
.layout{display:flex;min-height:100vh}
.backdrop{display:none;position:fixed;inset:0;background:rgba(11,11,9,.5);z-index:70}
.backdrop.on{display:block}
.sidebar{width:230px;background:var(--preto);color:var(--txt-inv);flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:80}
.sb-top{padding:20px;border-bottom:1px solid var(--linha-dark)}
.sb-logo{display:flex;align-items:center;gap:9px}
.sb-logo img{width:30px;height:30px;border-radius:7px}
.sb-logo b{font-size:14px;font-weight:700;letter-spacing:.04em}
.sb-logo .s{font-size:9.5px;letter-spacing:.16em;color:var(--txt-inv-suave);text-transform:uppercase}
.nav{padding:12px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;color:var(--txt-inv-suave);font-weight:500;cursor:pointer;margin-bottom:2px;font-size:13.5px}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav-item:hover{background:var(--preto-2);color:var(--ivory)}
.nav-item.on{background:var(--oliva);color:#fff}
.sb-bot{padding:14px;border-top:1px solid var(--linha-dark);font-size:11.5px;color:var(--txt-inv-suave)}
.sb-bot .who{color:var(--ivory);font-weight:600;margin-bottom:8px;font-size:12px;word-break:break-all}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{min-height:60px;background:var(--white);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px;padding:10px 20px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.topbar h2{font-size:16px;font-weight:700}
.hamb{display:none;background:none;border:1px solid var(--linha);border-radius:8px;padding:7px 9px}
.hamb svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2;display:block}
.search{margin-left:auto;position:relative;flex:1;max-width:320px;min-width:180px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--linha);border-radius:9px;background:var(--ivory)}
.search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;stroke:var(--txt-suave);fill:none;stroke-width:1.8}
.content{padding:22px 24px 60px;max-width:1180px;width:100%}

/* CARDS / TABLES */
.card{background:var(--white);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.card-h{padding:15px 18px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700}
.card-b{padding:16px 18px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--white);border:1px solid var(--linha);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-suave);font-weight:700}
.kpi .v{font-size:21px;font-weight:700;margin-top:7px}
.kpi .v.in{color:var(--receita)}.kpi .v.out{color:var(--despesa)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-suave);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--ivory-2);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.cell-name{font-weight:600}.cell-sub{font-size:11.5px;color:var(--txt-suave);font-weight:400;margin-top:2px}
.v-in{color:var(--receita);font-weight:600}.v-out{color:var(--despesa);font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-pend{background:var(--pend-bg);color:var(--pend)}
.p-atraso{background:var(--atraso-bg);color:var(--atraso)}.p-info{background:var(--info-bg);color:var(--info)}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--ivory-2);color:var(--txt-suave)}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--oliva);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.empty{padding:36px;text-align:center;color:var(--txt-suave)}
.loading{padding:28px;text-align:center;color:var(--txt-suave)}

/* generic list rows (mobile-friendly) */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--ivory-2);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--ivory)}
.lrow .r{margin-left:auto;text-align:right;white-space:nowrap}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.inp{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:9px;background:var(--white)}
.inp:focus{outline:none;border-color:var(--oliva)}
.lbl{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-suave);font-weight:600;margin-bottom:5px}
.chkrow{display:flex;gap:16px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:13px}
.chk input{width:17px;height:17px;accent-color:var(--oliva)}

/* progress */
.prog{background:var(--ivory-2);border-radius:20px;height:12px;overflow:hidden;margin:6px 0}
.prog > i{display:block;height:100%;background:var(--oliva);border-radius:20px;transition:width .4s}
.prog.full > i{background:var(--ok)}

/* OVERLAY / MODAL */
.overlay{position:fixed;inset:0;background:rgba(11,11,9,.5);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.overlay.on{display:flex}
.modal{background:var(--white);border-radius:16px;width:600px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center;position:sticky;top:0;background:var(--white)}
.modal-h h3{font-size:15px;font-weight:700}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--white)}
.x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--txt-suave);cursor:pointer;line-height:1}
.doc-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ivory-2);flex-wrap:wrap}
.doc-row:last-child{border:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--atraso)}
.resp{font-size:10px;color:var(--txt-suave);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.result-list{border:1px solid var(--linha);border-radius:9px;margin-top:6px;max-height:220px;overflow:auto}
.result-list .lrow{padding:10px 12px}

/* MOBILE */
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}

<script>
const SUPABASE_URL='https://fdjriojmowlpvophnrso.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkanJpb2ptb3dscHZvcGhucnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzE3NDAsImV4cCI6MjEwMzQwNzc0MH0.IfGDkV1_hDyDNHWhSdinqv1cIuxglGmpoCFav5Jn8zY';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const el=id=>document.getElementById(id);
window.el=el;
const BRL=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ini=n=>(n||'?').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>new Date().toISOString().slice(0,10);
const dBR=d=>{if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;};
const onlyNum=s=>(s||'').replace(/\D/g,'');
const cpfFmt=c=>{const d=onlyNum(c);return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):(c||'—');};
const slug=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'');
async function q(p){const{data,error}=await p;if(error){console.error(error);throw error;}return data;}
function openOv(t,b,f){el('ov-title').innerHTML=t;el('ov-body').innerHTML=b;el('ov-foot').innerHTML=f||'';el('ov').classList.add('on');}
function closeOv(){el('ov').classList.remove('on');}
el('ov').addEventListener('click',e=>{if(e.target===el('ov'))closeOv();});
function toggleNav(open){el('sidebar').classList.toggle('open',open);el('backdrop').classList.toggle('on',open);}
async function cepFill(cepId,logId,bairroId,cidId,ufId,numId,hintId){
  const cep=onlyNum(el(cepId).value); if(cep.length!==8)return;
  if(hintId)el(hintId).textContent='Buscando endereço…';
  try{const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);const d=await r.json();
    if(d.erro){if(hintId)el(hintId).textContent='CEP não encontrado.';return;}
    el(logId).value=d.logradouro||'';el(bairroId).value=d.bairro||'';el(cidId).value=d.localidade||'';el(ufId).value=d.uf||'';
    if(hintId)el(hintId).textContent='Endereço preenchido.';
    if(numId&&!el(numId).value)el(numId).focus();
  }catch(e){if(hintId)el(hintId).textContent='Falha ao buscar o CEP.';}
}
async function abrirDoc(path){
  try{const {data,error}=await sb.storage.from('documentos').createSignedUrl(path,3600);
    if(error)throw error; window.open(data.signedUrl,'_blank');
  }catch(e){alert('Não foi possível abrir o documento: '+(e.message||e));}
}

/* AUTH */
async function doLogin(){
  const m=el('li-msg');m.className='msg';m.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:el('li-email').value.trim(),password:el('li-pass').value});
  if(error){m.className='msg err';m.textContent='Não foi possível entrar: '+error.message;return;}
  m.textContent='';
}
el('li-btn').addEventListener('click',doLogin);
el('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
el('logout').addEventListener('click',()=>sb.auth.signOut());
sb.auth.onAuthStateChange((_e,s)=>{
  if(s&&s.user){el('login').style.display='none';el('app').style.display='block';el('who').textContent=s.user.email;go(currentView);}
  else{el('app').style.display='none';el('login').style.display='flex';}
});

/* NAV */
let currentView='inicio';
const titles={inicio:'Início',clientes:'Clientes',despachante:'Serviços de Despachante',academy:'Delta School Academy'};
function go(v){
  currentView=v; toggleNav(false);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.view===v));
  el('pageTitle').textContent=titles[v]||'—';
  el('view').innerHTML='<div class="loading">Carregando…</div>';
  ({inicio:vInicio,clientes:vClientes,despachante:vDespachante,academy:vAcademy}[v]||vInicio)();
}
el('nav').addEventListener('click',e=>{const it=e.target.closest('.nav-item');if(it)go(it.dataset.view);});
function erro(e){return `<div class="empty">Erro ao carregar: ${esc(e.message||e)}.<br><span class="muted">Verifique a conexão e recarregue.</span></div>`;}

/* ============ INÍCIO ============ */
async function vInicio(){
  try{
    const lanc=await q(sb.from('lancamentos').select('*').order('data',{ascending:false}));
    const rec=lanc.filter(l=>l.tipo==='receita').reduce((a,l)=>a+Number(l.valor),0);
    const des=lanc.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+Number(l.valor),0);
    const rows=lanc.map(l=>`<tr>
      <td>${l.tipo==='receita'?'<span class="pill p-ok">entrada</span>':'<span class="pill p-atraso">saída</span>'}</td>
      <td class="cell-name">${esc(l.descricao)}<div class="cell-sub">${esc(l.fornecedor||l.categoria||'')}</div></td>
      <td>${l.fonte==='auto'?'<span class="tag">automático</span>':'<span class="tag">manual</span>'}</td>
      <td class="mono">${dBR(l.data)}</td>
      <td class="mono ${l.tipo==='receita'?'v-in':'v-out'}" style="text-align:right">${l.tipo==='receita'?'+':'−'} ${BRL(l.valor)}</td></tr>`).join('');
    el('view').innerHTML=`
      <div class="grid g-kpi" style="margin-bottom:16px">
        <div class="kpi"><div class="l">Receitas</div><div class="v in">${BRL(rec)}</div></div>
        <div class="kpi"><div class="l">Despesas</div><div class="v out">${BRL(des)}</div></div>
        <div class="kpi"><div class="l">Saldo</div><div class="v">${BRL(rec-des)}</div></div>
        <div class="kpi"><div class="l">Lançamentos</div><div class="v">${lanc.length}</div></div>
      </div>
      <div class="card"><div class="card-h"><h3>Fluxo de caixa</h3><div class="spacer"></div>
        <button class="btn btn-sm" onclick="modalDespesa()">+ Lançar despesa</button></div>
        <div class="card-b" style="padding:0"><div class="tbl-wrap">${lanc.length?`<table><thead><tr><th>Tipo</th><th>Descrição</th><th>Fonte</th><th>Data</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Nenhum lançamento ainda.</div>'}</div></div></div>`;
  }catch(e){el('view').innerHTML=erro(e);}
}
function modalDespesa(){
  openOv('Lançar despesa',`<div class="form-grid">
    <div class="full"><label class="lbl">Descrição</label><input class="inp" id="d-desc"></div>
    <div><label class="lbl">Categoria</label><input class="inp" id="d-cat" placeholder="Operacional"></div>
    <div><label class="lbl">Fornecedor</label><input class="inp" id="d-forn"></div>
    <div><label class="lbl">Valor (R$)</label><input class="inp mono" id="d-val" type="number" step="0.01"></div>
    <div><label class="lbl">Data</label><input class="inp" id="d-data" type="date" value="${hoje()}"></div>
    </div><div class="msg" id="d-msg" style="color:var(--atraso)"></div>`,
    `<button class="btn btn-ghost" onclick="closeOv()">Cancelar</button><button class="btn" onclick="salvarDespesa()">Salvar</button>`);
}
async function salvarDespesa(){
  const desc=el('d-desc').value.trim(),val=parseFloat(el('d-val').value);
  if(!desc||!(val>0)){el('d-msg').textContent='Preencha descrição e valor.';return;}
  try{await q(sb.from('lancamentos').insert({tipo:'despesa',descricao:desc,categoria:el('d-cat').value.trim()||'Geral',fornecedor:el('d-forn').value.trim()||null,valor:val,data:el('d-data').value||hoje(),fonte:'manual'}));closeOv();vInicio();}
  catch(e){el('d-msg').textContent='Erro: '+e.message;}
}

/* ============ CLIENTES ============ */
let _clientes=[];
async function vClientes(filter=''){
  try{_clientes=await q(sb.from('clientes').select('*').order('nome'));renderClientes(filter);}
  catch(e){el('view').innerHTML=erro(e);}
}
function filtraClientes(f){
  f=(f||'').toLowerCase().trim();
  return _clientes.filter(c=>!f||[c.nome,c.cpf,c.telefone].some(x=>(x||'').toLowerCase().includes(f)||onlyNum(x).includes(onlyNum(f))));
}
function renderClientes(filter=''){
  const list=filtraClientes(filter);
  const rows=list.map(c=>`<div class="lrow" onclick="verCliente('${c.id}')">
      <div class="avatar">${ini(c.nome)}</div>
      <div style="min-width:0"><div class="cell-name">${esc(c.nome)}</div><div class="cell-sub">${esc(cpfFmt(c.cpf))} · ${esc(c.telefone||'—')}</div></div>
      <div class="r"><span class="tag">${esc(c.interesse||'—')}</span></div></div>`).join('');
  el('view').innerHTML=`<div class="card"><div class="card-h"><h3>Clientes <span class="muted" style="font-weight:500">(${list.length})</span></h3><div class="spacer"></div>
      <button class="btn btn-sm" onclick="modalCliente()">+ Novo cliente</button></div>
      <div class="card-b" style="padding:0">${list.length?rows:'<div class="empty">Nenhum cliente encontrado.</div>'}</div></div>`;
}

function modalCliente(cli){
  openOv(cli?'Editar cliente':'Novo cliente',clienteFormHTML(),
    `<button class="btn btn-ghost" onclick="closeOv()">Cancelar</button><button class="btn" onclick="salvarCliente(${cli?("'"+cli.id+"'"):''})">${cli?'Salvar alterações':'Salvar cliente'}</button>`);
  if(cli){const set=(id,v)=>{const e=el(id);if(e)e.value=(v==null?'':v);};
    set('c-nome',cli.nome);set('c-cpf',cpfFmt(cli.cpf));set('c-rg',cli.rg);set('c-nasc',cli.nascimento);
    set('c-prof',cli.profissao);set('c-nac',cli.nacionalidade);set('c-natu',cli.naturalidade);
    set('c-ecivil',cli.estado_civil);
    set('c-tel',cli.telefone);set('c-email',cli.email);set('c-insta',cli.instagram);
    set('c-cep',cli.cep);set('c-num',cli.numero);set('c-log',cli.logradouro);set('c-bairro',cli.bairro);
    set('c-comp',cli.complemento);set('c-cidade',cli.cidade);set('c-uf',cli.uf);set('c-cr',cli.cr_caf);
    set('c-clube',cli.clube);set('c-interesse',cli.interesse);set('c-area',cli.area_interesse);
    set('c-serv',cli.servico_desejado);set('c-origem',cli.origem);set('c-obs',cli.observacoes);}

async function salvarCliente(id){
  const nome=el('c-nome').value.trim();
  if(!nome){el('c-msg').textContent='Informe o nome.';return;}
  const rec={nome,cpf:onlyNum(el('c-cpf').value)||null,rg:el('c-rg').value.trim()||null,
    nascimento:el('c-nasc').value||null,profissao:el('c-prof').value.trim()||null,estado_civil:el('c-ecivil').value||null,
    nacionalidade:el('c-nac').value.trim()||null,naturalidade:el('c-natu').value.trim()||null,
    telefone:el('c-tel').value.trim()||null,email:el('c-email').value.trim()||null,
    cep:el('c-cep').value.trim()||null,logradouro:el('c-log').value.trim()||null,
    numero:el('c-num').value.trim()||null,complemento:el('c-comp').value.trim()||null,
    bairro:el('c-bairro').value.trim()||null,cidade:el('c-cidade').value.trim()||null,
    uf:el('c-uf').value.trim().toUpperCase()||null,cr_caf:el('c-cr').value.trim()||null,
    clube:el('c-clube').value.trim()||null,interesse:el('c-interesse').value||null,
    instagram:el('c-insta').value.trim()||null,area_interesse:el('c-area').value||null,servico_desejado:el('c-serv').value||null,
    origem:el('c-origem').value||null,observacoes:el('c-obs').value.trim()||null};
  try{if(id){await q(sb.from('clientes').update(rec).eq('id',id));}else{await q(sb.from('clientes').insert(rec));}closeOv();vClientes();}
  catch(e){el('c-msg').textContent=((e.message||'').toLowerCase().includes('duplicate')?'Este CPF já está cadastrado.':'Erro: '+e.message);}
}
async function excluirCliente(id){
  if(!confirm('Excluir este cliente definitivamente? Esta ação não pode ser desfeita.'))return;
  try{await q(sb.from('clientes').delete().eq('id',id));closeOv();vClientes();}
  catch(e){const m=(e.message||'').toLowerCase();
    if(m.includes('foreign')||m.includes('violates')||m.includes('constraint'))alert('Não é possível excluir: o cliente tem matrículas, serviços ou processos vinculados. Remova-os antes.');
    else alert('Erro ao excluir: '+(e.message||e));}
}
async function verCliente(id){
  try{
    const c=(await q(sb.from('clientes').select('*').eq('id',id)))[0]; window._cliAtual=c;
    const docs=await q(sb.from('documentos').select('*, documentos_catalogo(nome_comercial,nome_sistema)').eq('cliente_id',id));
    const procs=await q(sb.from('processos').select('*, tipos_processo(nome)').eq('cliente_id',id));
    const docRows=docs.length?docs.map(d=>{
      const nome=d.documentos_catalogo?.nome_comercial||d.tipo_doc||'Documento';
      const venc=d.data_validade?` · vence ${dBR(d.data_validade)}`:'';
      const link=d.drive_url?`<button class="btn btn-ghost btn-sm" onclick="abrirDoc('${esc(d.drive_url)}')">Abrir</button>`:'';
      return `<div class="doc-row"><span class="dot ${d.status==='recebido'?'on':'off'}"></span><div style="flex:1;min-width:0">${esc(nome)}<div class="cell-sub">${esc(d.nome_padrao||'')}${venc}</div></div>${link}</div>`;
    }).join(''):'<div class="muted" style="padding:8px 0">Nenhum documento ainda.</div>';
    const procRows=procs.length?procs.map(p=>`<div class="doc-row" style="cursor:pointer" onclick="openProcesso('${p.id}')"><div style="flex:1">${esc(p.tipos_processo?.nome||'Processo')}<div class="cell-sub">${esc((p.atividade||'').replace(/,/g,', '))}</div></div><span class="pill p-info">${esc(p.status)}</span></div>`).join(''):'<div class="muted" style="padding:8px 0">Nenhum processo.</div>';
    openOv(esc(c.nome),`
      <div class="rowflex" style="margin-bottom:14px"><div class="avatar" style="width:44px;height:44px;font-size:15px">${ini(c.nome)}</div>
        <div><div style="font-weight:700">${esc(c.nome)}</div><div class="cell-sub">${esc(cpfFmt(c.cpf))} · ${esc(c.telefone||'—')}</div></div></div>
      <div class="form-grid" style="margin-bottom:16px">
        <div><span class="lbl">Cidade</span>${esc(c.cidade||'—')}${c.uf?'/'+esc(c.uf):''}</div>
        <div><span class="lbl">Nascimento</span>${dBR(c.nascimento)}</div>
        <div><span class="lbl">E-mail</span>${esc(c.email||'—')}</div>
        <div><span class="lbl">Interesse</span>${esc(c.interesse||'—')}</div></div>
      <div style="margin-bottom:12px"><button class="btn btn-ghost btn-sm" onclick="modalDeclaracao('${c.id}')">Emitir declaração (PDF)</button></div>
      <div class="lbl">Documentos</div>${docRows}
      <div class="lbl" style="margin-top:14px">Processos</div>${procRows}`,
      `<button class="btn btn-ghost" onclick="closeOv()">Fechar</button><button class="btn btn-ghost" onclick="modalCliente(window._cliAtual)">Editar</button><button class="btn btn-danger" onclick="excluirCliente('${c.id}')">Excluir</button>`);
  }catch(e){openOv('Erro',erro(e));}
}

/* ============ DESPACHANTE ============ */
let _tipos=[]; let SEL={cid:null,nome:null,tel:null};
async function vDespachante(){
  try{
    _tipos=await q(sb.from('tipos_processo').select('*').order('nome'));
    _clientes=await q(sb.from('clientes').select('id,nome,cpf,telefone').order('nome'));
    const procs=await q(sb.from('processos').select('id,status,atividade, clientes(nome), tipos_processo(nome)').order('criado_em',{ascending:false}));
    const optT=_tipos.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('');
    const procRows=procs.length?procs.map(p=>`<div class="lrow" onclick="openProcesso('${p.id}')">
        <div style="min-width:0"><div class="cell-name">${esc(p.clientes?.nome||'—')}</div><div class="cell-sub">${esc(p.tipos_processo?.nome||'')}</div></div>
        <div class="r"><span class="pill p-info">${esc(p.status)}</span></div></div>`).join(''):'<div class="empty">Nenhum processo aberto ainda.</div>';
    el('view').innerHTML=`
      <div class="card"><div class="card-h"><h3>Montar processo</h3></div><div class="card-b">
        <label class="lbl">Cliente</label>
        <input class="inp" id="dp-busca" placeholder="Buscar por nome, CPF ou telefone…" autocomplete="off">
        <div id="dp-res"></div>
        <div id="dp-sel" style="margin-top:8px"></div>
        <div class="form-grid" style="margin-top:14px">
          <div><label class="lbl">Operação</label><select class="inp" id="dp-tipo">${optT}</select></div>
          <div><label class="lbl">Atividade (pode marcar mais de uma)</label>
            <div class="chkrow" style="padding-top:6px">
              <label class="chk"><input type="checkbox" id="act-atirador" checked> Atirador</label>
              <label class="chk"><input type="checkbox" id="act-colecionador"> Colecionador</label>
              <label class="chk"><input type="checkbox" id="act-cacador"> Caçador</label>
            </div></div>
        </div>
        <button class="btn" style="margin-top:14px;width:100%" onclick="iniciarProcesso()">Abrir processo e ver documentos</button>
      </div></div>
      <div id="dp-out"></div>
      <div class="card"><div class="card-h"><h3>Processos em andamento</h3></div><div class="card-b" style="padding:0">${procRows}</div></div>`;
    el('dp-busca').addEventListener('input',e=>buscaClienteDP(e.target.value));
  }catch(e){el('view').innerHTML=erro(e);}
}
function buscaClienteDP(term){
  const list=filtraClientes(term).slice(0,8);
  if(!term.trim()||!list.length){el('dp-res').innerHTML='';return;}
  el('dp-res').innerHTML=`<div class="result-list">${list.map(c=>`<div class="lrow" onclick="selCliente('${c.id}')"><div><div class="cell-name">${esc(c.nome)}</div><div class="cell-sub">${esc(cpfFmt(c.cpf))} · ${esc(c.telefone||'—')}</div></div></div>`).join('')}</div>`;
}
function selCliente(id){
  const c=_clientes.find(x=>x.id===id); if(!c)return;
  SEL={cid:c.id,nome:c.nome,tel:c.telefone};
  el('dp-busca').value=''; el('dp-res').innerHTML='';
  el('dp-sel').innerHTML=`<div class="rowflex" style="background:var(--ivory);border-radius:9px;padding:9px 12px"><div class="avatar">${ini(c.nome)}</div><div><div class="cell-name">${esc(c.nome)}</div><div class="cell-sub">${esc(cpfFmt(c.cpf))}</div></div><div class="spacer"></div><button class="btn btn-ghost btn-sm" onclick="limparSel()">Trocar</button></div>`;
}
function limparSel(){SEL={cid:null,nome:null,tel:null};el('dp-sel').innerHTML='';}
function actsSelecionadas(){return ['atirador','colecionador','cacador'].filter(a=>{const e=el('act-'+a);return e&&e.checked;});}
async function iniciarProcesso(){
  if(!SEL.cid){alert('Busque e selecione um cliente primeiro.');return;}
  const acts=actsSelecionadas();
  if(!acts.length){alert('Marque ao menos uma atividade.');return;}
  try{
    const p=await q(sb.from('processos').insert({cliente_id:SEL.cid,tipo_processo_id:el('dp-tipo').value,atividade:acts.join(','),status:'coleta_documentos'}).select().single());
    openProcesso(p.id);
  }catch(e){alert('Erro ao abrir processo: '+(e.message||e));}
}
function condOK(cond,act){
  const has=a=>act.includes(a);
  if(cond==='sempre'||cond==='se_2o_endereco')return true;
  if(cond==='so_atirador')return has('atirador');
  if(cond==='condicional_cacador')return has('cacador');
  if(cond==='condicional_colecionador')return has('colecionador');
  if(cond==='dispensado_colecionador')return !(act.length===1&&act[0]==='colecionador');
  return true;
}
async function openProcesso(pid){
  if(currentView!=='despachante'){closeOv();go('despachante');}
  for(let i=0;i<40 && !el('dp-out');i++){await new Promise(r=>setTimeout(r,50));}
  if(!el('dp-out'))return;
  try{
    const p=(await q(sb.from('processos').select('*, clientes(nome,telefone,cpf), tipos_processo(nome)').eq('id',pid)))[0];
    SEL={cid:p.cliente_id,nome:p.clientes?.nome,tel:p.clientes?.telefone};
    await renderChecklist(p.cliente_id,p.tipo_processo_id,(p.atividade||'').split(',').filter(Boolean),pid,p);
    el('dp-out').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){el('dp-out').innerHTML=erro(e);}
}
async function renderChecklist(cid,tid,acts,pid,p){
  el('dp-out').innerHTML='<div class="loading">Cruzando documentos…</div>';
  try{
    const req=await q(sb.from('tipos_processo_docs').select('condicional,ordem, documentos_catalogo(id,codigo,nome_comercial,nome_sistema,responsavel,validade_dias)').eq('tipo_processo_id',tid).order('ordem'));
    const cli=(await q(sb.from('clientes').select('*').eq('id',cid)))[0];
    const docs=await q(sb.from('documentos').select('catalogo_id,status,data_validade,nome_padrao,drive_url').eq('cliente_id',cid));
    const has=catId=>docs.find(d=>d.catalogo_id===catId&&d.status==='recebido'&&(!d.data_validade||d.data_validade>=hoje()));
    const respLabel={cliente:'Cliente',delta:'Delta',agente_credenciado:'Agente credenciado',clube:'Clube',sistema:'Taxa/Sistema'};
    const aplic=req.filter(r=>condOK(r.condicional,acts));
    let faltam=0;
    const rows=aplic.map(r=>{const d=r.documentos_catalogo;const g=has(d.id);if(!g)faltam++;
      const cond=r.condicional==='se_2o_endereco'?' <span class="tag">se 2º end.</span>':'';
      const acao=g?`<button class="btn btn-ghost btn-sm" onclick="abrirDoc('${esc(g.drive_url||'')}')" ${g.drive_url?'':'disabled'}>Abrir</button>`
                 :`${(d.codigo==='D09'||d.codigo==='D12')?`<button class="btn btn-ghost btn-sm" onclick="modalDeclaracao('${cid}','${d.codigo}')">Gerar</button> `:''}<button class="btn btn-sm" onclick="uploadDoc('${cid}','${d.id}','${pid}','${esc(d.nome_comercial||d.nome_sistema)}',${d.validade_dias||'null'})">Enviar</button>`;
      return `<div class="doc-row"><span class="dot ${g?'on':'off'}"></span>
        <div style="flex:1;min-width:0">${esc(d.nome_comercial||d.nome_sistema)}${cond}<div class="cell-sub">${esc(d.nome_sistema)}</div></div>
        <span class="resp">${respLabel[d.responsavel]||d.responsavel}</span>${acao}</div>`;}).join('');
    const tel=onlyNum(cli.telefone);
    el('dp-out').innerHTML=`<div class="card"><div class="card-h"><h3>${esc(p?.tipos_processo?.nome||_tipos.find(t=>t.id===tid)?.nome||'Processo')} — ${esc(cli.nome)}</h3>
        <div class="spacer"></div><span class="muted">${aplic.length-faltam}/${aplic.length} ok</span></div>
        <div class="card-b">
          <div class="muted" style="font-size:12px;margin-bottom:10px">Atividade: ${esc(acts.join(', ')||'—')} · Pasta no Drive: <b>${esc((onlyNum(cli.cpf)||'SEMCPF')+'_'+slug(cli.nome))}</b></div>
          ${rows}
          <div class="rowflex" style="margin-top:16px">
            <button class="btn btn-ghost btn-sm" onclick="copiarMsg('${cid}','${tid}','${acts.join(',')}')">Copiar pendências</button>
            ${tel?`<button class="btn btn-sm" onclick="abrirWa('${cid}','${tid}','${acts.join(',')}','${tel}')">WhatsApp</button>`:''}
            <div class="spacer"></div>
            <select class="inp" style="width:auto" onchange="mudarStatus('${pid}',this.value)">
              ${['triagem','coleta_documentos','protocolado','concluido','cancelado'].map(s=>`<option ${p&&p.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
            <button class="btn btn-danger btn-sm" onclick="excluirProcesso('${pid}')">Excluir processo</button>
          </div>
        </div></div>`;
  }catch(e){el('dp-out').innerHTML=erro(e);}
}
async function mudarStatus(pid,status){try{await q(sb.from('processos').update({status}).eq('id',pid));}catch(e){alert('Erro: '+e.message);}}
async function excluirProcesso(pid){
  if(!confirm('Excluir este processo? Os documentos já enviados continuam no cadastro do cliente. Esta ação não pode ser desfeita.'))return;
  try{
    await q(sb.from('documentos').update({processo_id:null}).eq('processo_id',pid));
    await q(sb.from('processos').delete().eq('id',pid));
    el('dp-out').innerHTML=''; vDespachante();
  }catch(e){alert('Erro ao excluir processo: '+(e.message||e));}
}
function uploadDoc(cid,catId,pid,nome,validadeDias){
  const inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.jpg,.jpeg,.png,.webp';
  inp.onchange=()=>{if(inp.files[0])doUpload(cid,catId,pid,nome,validadeDias,inp.files[0]);};
  inp.click();
}
async function doUpload(cid,catId,pid,nome,validadeDias,file){
  try{
    const cli=(await q(sb.from('clientes').select('cpf,nome').eq('id',cid)))[0];
    const ext=(file.name.split('.').pop()||'pdf').toLowerCase();
    const emiss=hoje();
    const base=(onlyNum(cli.cpf)||'SEMCPF')+'_'+slug(cli.nome);
    const nomePadrao=`${base}_${slug(nome)}_${emiss}.${ext}`;
    const path=`${base}/${nomePadrao}`;
    const up=await sb.storage.from('documentos').upload(path,file,{upsert:true});
    if(up.error)throw up.error;
    let validade=null;if(validadeDias&&validadeDias!=='null'){const dt=new Date();dt.setDate(dt.getDate()+Number(validadeDias));validade=dt.toISOString().slice(0,10);}
    await q(sb.from('documentos').insert({cliente_id:cid,catalogo_id:catId,processo_id:pid||null,tipo_doc:nome,nome_padrao:nomePadrao,drive_url:path,data_emissao:emiss,data_validade:validade,status:'recebido'}));
    openProcesso(pid);
  }catch(e){alert('Erro ao enviar documento: '+(e.message||e));}
}
async function faltantes(cid,tid,actsStr){
  const acts=actsStr.split(',').filter(Boolean);
  const req=await q(sb.from('tipos_processo_docs').select('condicional, documentos_catalogo(id,nome_comercial,nome_sistema,responsavel)').eq('tipo_processo_id',tid));
  const docs=await q(sb.from('documentos').select('catalogo_id,status,data_validade').eq('cliente_id',cid));
  const has=catId=>docs.some(d=>d.catalogo_id===catId&&d.status==='recebido'&&(!d.data_validade||d.data_validade>=hoje()));
  return req.filter(r=>condOK(r.condicional,acts)&&!has(r.documentos_catalogo.id)).map(r=>r.documentos_catalogo);
}
// só o que é responsabilidade do CLIENTE entra na cobrança enviada a ele
function soDoCliente(lista){return lista.filter(d=>d.responsavel==='cliente');}
function msgPend(op,nome,lista){
  const linhas=lista.map(d=>`• ${d.nome_comercial||d.nome_sistema}`).join('\n');
  return `Olá, ${nome}! Aqui é da Delta School Academy.\n\nPara darmos andamento ao seu processo de *${op}*, precisamos que você nos envie:\n\n${linhas}\n\nAssim que puder, envie por aqui. O restante da documentação nós já estamos providenciando. Qualquer dúvida, estamos à disposição.`;
}
async function copiarMsg(cid,tid,actsStr){
  try{const cli=(await q(sb.from('clientes').select('nome').eq('id',cid)))[0];
    const lista=soDoCliente(await faltantes(cid,tid,actsStr));const op=_tipos.find(t=>t.id===tid)?.nome||'processo';
    await navigator.clipboard.writeText(lista.length?msgPend(op,cli.nome,lista):`Olá, ${cli.nome}! Não há pendências suas para o processo de ${op} no momento. 👍`);
    alert('Mensagem copiada (somente documentos do cliente).');
  }catch(e){alert('Erro: '+e.message);}
}
async function abrirWa(cid,tid,actsStr,tel){
  const cli=(await q(sb.from('clientes').select('nome').eq('id',cid)))[0];
  const lista=soDoCliente(await faltantes(cid,tid,actsStr));const op=_tipos.find(t=>t.id===tid)?.nome||'processo';
  const txt=lista.length?msgPend(op,cli.nome,lista):`Olá, ${cli.nome}! Não há pendências suas para o processo de ${op} no momento. 👍`;
  const num=tel.length<=11?'55'+tel:tel;
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`,'_blank');
}

async function vAcademy(){
  try{
    const cursos=await q(sb.from('cursos').select('*').order('nome'));
    const turmas=await q(sb.from('turmas').select('*, cursos(nome,carga_horaria,valor_padrao), matriculas(valor_total, pagamentos(valor))').order('data'));

        <div><div class="cell-name">${esc(c.nome)}</div><div class="cell-sub">${esc(c.carga_horaria||'')}${c.valor_padrao?' · '+BRL(c.valor_padrao):''}</div></div>
        <div class="r"><span class="tag">${c.ativo?'ativo':'inativo'}</span></div></div>`).join(''):'<div class="empty">Nenhum curso.</div>';
    const turmaCards=turmas.length?turmas.map(t=>{
      const tot=(t.matriculas||[]).reduce((a,m)=>a+Number(m.valor_total),0);
      const pago=(t.matriculas||[]).reduce((a,m)=>a+(m.pagamentos||[]).reduce((x,p)=>x+Number(p.valor),0),0);
      const pct=tot>0?Math.round(pago/tot*100):0;const alunos=(t.matriculas||[]).length;
      return `<div class="card"><div class="card-h"><h3>${esc(t.cursos?.nome||'Curso')}</h3><span class="pill p-info">${esc(t.status)}</span><div class="spacer"></div><span class="muted mono">${dBR(t.data)}${t.hora?(' · '+t.hora.slice(0,5)):''}</span></div>
        <div class="card-b">
          <div class="rowflex" style="font-size:12px"><span class="muted">${alunos} aluno(s)</span><div class="spacer"></div><span class="muted">Recebido ${BRL(pago)} de ${BRL(tot)}</span></div>
          <div class="prog ${pct>=100?'full':''}"><i style="width:${pct}%"></i></div>
          <div class="rowflex" style="margin-top:8px"><span class="muted" style="font-size:12px">${pct}% pago</span><div class="spacer"></div><button class="btn btn-sm" onclick="verTurma('${t.id}')">Gerenciar turma</button></div>
        </div></div>`;}).join(''):'<div class="empty">Nenhuma turma.</div>';
    const planos=await q(sb.from('planos').select('*, clientes(nome), pagamentos(valor,competencia)').order('criado_em',{ascending:false}));
    const mesAtual=new Date().toISOString().slice(0,7);
    const planoCards=planos.length?planos.map(pl=>{
      const receb=(pl.pagamentos||[]).reduce((a,p)=>a+Number(p.valor),0);
      const pagoMes=(pl.pagamentos||[]).some(p=>p.competencia===mesAtual);
      const per=pl.periodicidade==='avulso'?'':' / '+pl.periodicidade;
      const statusMes=pl.periodicidade==='mensal'?(pagoMes?'<span class="pill p-ok">mês pago</span>':'<span class="pill p-atraso">mês em aberto</span>'):'';
      return `<div class="lrow" onclick="verPlano('${pl.id}')">
        <div style="min-width:0"><div class="cell-name">${esc(pl.titulo)} ${pl.ativo?'':'<span class="tag">inativo</span>'}</div>
          <div class="cell-sub">${esc(pl.clientes?.nome||'—')} · ${BRL(pl.valor)}${per}</div></div>
        <div class="r">${statusMes}<div class="cell-sub">Recebido ${BRL(receb)}</div></div></div>`;}).join(''):'<div class="empty">Nenhum plano personalizado.</div>';
    el('view').innerHTML=`
      <div class="card"><div class="card-h"><h3>Cursos</h3><div class="spacer"></div><button class="btn btn-sm" onclick="modalCurso()">+ Novo curso</button></div>
        <div class="card-b" style="padding:0">${cursoRows}</div></div>

/* ============ PDF: DECLARAÇÕES E CERTIFICADOS ============ */
const jsq=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataSimples(){const d=new Date();return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;}
function endComp(c){return [c.logradouro,c.numero&&('nº '+c.numero),c.complemento,c.bairro,c.cidade&&(c.cidade+(c.uf?' – '+c.uf:''))].filter(Boolean).join(', ');}
function jpdf(orient){const {jsPDF}=window.jspdf;return new jsPDF({orientation:orient||'portrait',unit:'mm',format:'a4'});}
function genDeclaracaoPDF(titulo,paragrafos,assinatura,rodape,filename){
  const doc=jpdf('portrait');const W=210,margin=22,maxw=W-margin*2;let y=30;
  doc.setFont('helvetica','bold');doc.setFontSize(13);
  doc.splitTextToSize(titulo,maxw).forEach(l=>{doc.text(l,W/2,y,{align:'center'});y+=7;});
  y+=8; doc.setFont('helvetica','normal');doc.setFontSize(11.5);
  paragrafos.forEach(p=>{const lines=doc.splitTextToSize(p,maxw);doc.text(lines,margin,y,{lineHeightFactor:1.5});y+=lines.length*6.4+5;});
  y+=18;
  if(assinatura){doc.text('_________________________________________',W/2,y,{align:'center'});y+=6;doc.setFont('helvetica','bold');doc.text(assinatura,W/2,y,{align:'center'});doc.setFont('helvetica','normal');y+=9;}
  if(rodape&&rodape.length){doc.setFontSize(9.5);doc.setTextColor(90,90,85);rodape.forEach(r=>{const l=doc.splitTextToSize(r,maxw);doc.text(l,margin,y);y+=l.length*5;});}
  doc.save(filename);
}
async function gerarDSA(cid,atividade,finalidade){
  const c=(await q(sb.from('clientes').select('*').eq('id',cid)))[0];
  const p1=`EU, ${c.nome}, ${c.nacionalidade||'brasileiro(a)'}, natural de ${c.naturalidade||'—'}, nascido em ${dBR(c.nascimento)}, ${c.profissao||'—'}, residindo em ${endComp(c)}, CEP ${c.cep||'—'} e CPF nº ${cpfFmt(c.cpf)}.`;
  const p2=`DECLARO, para fim de ${finalidade}, que o local de guarda do meu acervo de ${atividade}, possui cofre ou lugar seguro, com tranca, para armazenamento das armas de fogo desmuniciadas de que sou proprietário, e de que adotarei as medidas necessárias para impedir que menor de dezoito anos de idade ou pessoa civilmente incapaz se apodere de arma de fogo sob minha posse ou de minha propriedade, observado o disposto no art. 13 da Lei nº 10.826, de 2003.`;
  const p3=`${(c.cidade||'').toUpperCase()}${c.uf?' – '+c.uf:''}, ${dataSimples()}.`;
  genDeclaracaoPDF('ANEXO A\nDECLARAÇÃO DE SEGURANÇA DO ACERVO (DSA)',[p1,p2,p3],c.nome,null,`DSA_${slug(c.nome)}.pdf`);
}
async function gerarInexistencia(cid){
  const c=(await q(sb.from('clientes').select('*').eq('id',cid)))[0];
  const p1=`EU, ${c.nome}, portador do RG nº ${c.rg||'—'} e do CPF nº ${cpfFmt(c.cpf)}${c.estado_civil?', '+c.estado_civil.toLowerCase():''}, residente na ${endComp(c)}, CEP ${c.cep||'—'}, declaro sob as penas da lei, que não respondo processo criminal e/ou inquérito policial, e estou ciente de que, em caso de falsidade ideológica, ficarei sujeito às sanções prescritas no Código Penal e às demais cominações legais aplicáveis.`;
  const art=`Art. 299 – "Omitir, em documento público ou particular, declaração que nele deveria constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre o fato juridicamente relevante. Pena: reclusão de 1 (um) a 5 (cinco) anos e multa, se o documento é público e reclusão de 1 (um) a 3 (três) anos, se o documento é particular."`;
  const p3=`${(c.cidade||'').toUpperCase()}${c.uf?' – '+c.uf:''}, ${dataSimples()}.`;
  genDeclaracaoPDF('DECLARAÇÃO DE INEXISTÊNCIA DE INQUÉRITOS POLICIAIS OU PROCESSOS CRIMINAIS',[p1,art,p3],`${c.nome}\nCPF: ${cpfFmt(c.cpf)}`,null,`Inexistencia_${slug(c.nome)}.pdf`);
}
async function gerarResidencia(cid,decl){
  const c=(await q(sb.from('clientes').select('*').eq('id',cid)))[0];
  const p1=`Eu, ${decl.nome}, residente na ${decl.endereco}, CPF nº ${decl.cpf}, RG nº ${decl.rg} - Órgão Exped. ${decl.orgao}.`;
  const p2=`Declaro, a pedido do(a) interessado(a) e para fins de prova de residência, que o(a) Sr.(a) ${c.nome}, inscrito(a) no CPF: ${cpfFmt(c.cpf)}, portador(a) do RG ${c.rg||'—'}, reside comigo neste endereço desde o ano de ${decl.desde}.`;
  const p3=`Por ser verdade, dato e assino o presente documento, declarando estar ciente de que responderei criminalmente em caso de falsidade das informações aqui prestadas.`;
  const p4=`Local: ${decl.cidade||c.cidade||''}, ${dataSimples()}.`;
  genDeclaracaoPDF('DECLARAÇÃO DE RESIDÊNCIA',[p1,p2,p3,p4],`${decl.nome}\nAssinatura do Declarante`,
    ['Observações:','1) Reconhecer firma desta declaração.','2) Anexar comprovante de residência em nome do declarante.'],
    `Residencia_${slug(c.nome)}.pdf`);
}
function modalDeclaracao(cid,preset){
  openOv('Emitir declaração',`
    <div class="form-grid">
      <div class="full"><label class="lbl">Tipo de declaração</label>
        <select class="inp" id="dec-tipo" onchange="decToggle()">
          <option value="dsa">Segurança do Acervo (DSA)</option>
          <option value="inex">Inexistência de Inquérito</option>
          <option value="resid">Residência (por terceiro)</option>
        </select></div>
    </div>
    <div id="dec-dsa" style="margin-top:6px">
      <div class="form-grid">
        <div><label class="lbl">Atividade do acervo</label><select class="inp" id="dec-ativ"><option>Colecionador</option><option>Atirador Desportivo</option><option>Caçador</option></select></div>
        <div><label class="lbl">Finalidade</label><input class="inp" id="dec-fin" value="aquisição de arma de fogo"></div>
      </div>
    </div>
    <div id="dec-resid" style="display:none;margin-top:6px">
      <div class="muted" style="font-size:12px;margin-bottom:8px">Dados de quem declara (parente/cônjuge dono do comprovante):</div>
      <div class="form-grid">
        <div class="full"><label class="lbl">Nome do declarante</label><input class="inp" id="dr-nome"></div>
        <div><label class="lbl">CPF</label><input class="inp mono" id="dr-cpf"></div>
        <div><label class="lbl">RG</label><input class="inp mono" id="dr-rg"></div>
        <div><label class="lbl">Órgão expedidor</label><input class="inp" id="dr-orgao" placeholder="SSP/RS"></div>
        <div><label class="lbl">Reside desde (ano)</label><input class="inp mono" id="dr-desde" placeholder="2020"></div>
        <div class="full"><label class="lbl">Endereço do declarante</label><input class="inp" id="dr-end"></div>
        <div><label class="lbl">Cidade</label><input class="inp" id="dr-cidade"></div>
      </div>
    </div>
    <div class="msg" id="dec-msg" style="color:var(--atraso)"></div>`,
    `<button class="btn btn-ghost" onclick="closeOv()">Fechar</button><button class="btn" onclick="emitirDeclaracao('${cid}')">Gerar PDF</button>`);
  if(preset==='D09')el('dec-tipo').value='dsa';
  if(preset==='D12')el('dec-tipo').value='inex';
  decToggle();
}
function decToggle(){const t=el('dec-tipo').value;el('dec-dsa').style.display=(t==='dsa')?'block':'none';el('dec-resid').style.display=(t==='resid')?'block':'none';}
async function emitirDeclaracao(cid){
  const t=el('dec-tipo').value;
  try{
    if(t==='dsa')await gerarDSA(cid,el('dec-ativ').value,el('dec-fin').value.trim()||'aquisição de arma de fogo');
    else if(t==='inex')await gerarInexistencia(cid);
    else{
      const decl={nome:el('dr-nome').value.trim(),cpf:el('dr-cpf').value.trim(),rg:el('dr-rg').value.trim(),orgao:el('dr-orgao').value.trim(),desde:el('dr-desde').value.trim(),endereco:el('dr-end').value.trim(),cidade:el('dr-cidade').value.trim()};
      if(!decl.nome||!decl.endereco){el('dec-msg').textContent='Preencha ao menos nome e endereço do declarante.';return;}
      await gerarResidencia(cid,decl);
    }
    closeOv();
  }catch(e){el('dec-msg').textContent='Erro ao gerar: '+(e.message||e);}
}
async function emitirCertificado(cid,nome,curso,turmaId,cursoId){
  // Layout temporário (funcional). Será substituído pelo modelo oficial da Delta.
  const doc=jpdf('landscape');const W=297,H=210;
  doc.setDrawColor(91,101,67);doc.setLineWidth(1.4);doc.rect(12,12,W-24,H-24);
  doc.setDrawColor(138,148,100);doc.setLineWidth(0.4);doc.rect(16,16,W-32,H-32);
  doc.setFont('helvetica','bold');doc.setTextColor(11,11,9);doc.setFontSize(30);
  doc.text('CERTIFICADO',W/2,54,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(13);doc.setTextColor(60,60,55);
  doc.text('Certificamos que',W/2,78,{align:'center'});
  doc.setFont('helvetica','bold');doc.setFontSize(24);doc.setTextColor(11,11,9);
  doc.text(nome,W/2,96,{align:'center',maxWidth:W-60});
  doc.setFont('helvetica','normal');doc.setFontSize(13);doc.setTextColor(60,60,55);
  doc.text(doc.splitTextToSize(`concluiu com aproveitamento o curso ${curso}.`,W-90),W/2,112,{align:'center'});
  doc.setFontSize(11);doc.text(dataSimples(),W/2,146,{align:'center'});
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(120,120,110);
  doc.text('DELTA SCHOOL ACADEMY',W/2,H-30,{align:'center'});
  doc.save(`Certificado_${slug(nome)}.pdf`);
  try{await q(sb.from('certificados').insert({cliente_id:cid,curso_id:cursoId||null,turma_id:turmaId||null,nome_no_certificado:nome,curso_nome:curso}));}catch(e){console.warn('registro cert:',e.message);}
}
